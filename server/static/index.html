<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giva Template Studio</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="layout">
    <main class="chat-pane">
      <header class="chat-header">
        <div class="brand">Giva Template Studio</div>
        <div class="agent-badge" id="agent-badge">Triage Agent</div>
      </header>
      <div class="messages" id="messages"></div>
      <form class="composer" id="composer">
        <input
          id="message-input"
          type="text"
          placeholder="e.g. Create a WhatsApp template for our Rakhi sale"
          autocomplete="off"
        />
        <button type="submit">Send</button>
      </form>
    </main>
    <aside class="templates-pane">
      <h2>Saved templates</h2>
      <div id="templates-list" class="templates-list"></div>
    </aside>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
